site_name: Spiralverse-AetherMoore Documentation
site_description: SCBE Post-Quantum Cryptographic Framework with Sacred Tongue Tokenization
site_author: Isaac Davis
site_url: https://github.com/issdandavis/scbe-aethermoore-demo

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - footnotes

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quick-start.md
    - Installation: getting-started/installation.md
    - Basic Examples: getting-started/examples.md
  - Technical Guides:
    - Sacred Tongue Tokenizer: guides/sacred-tongue-tokenizer.md
    - Harmonic Scaling Law: guides/harmonic-scaling-law.md
    - Security Gate: guides/security-gate.md
    - Layer Architecture: guides/layer-architecture.md
  - Technical Specs:
    - SCBE Math Claims: specs/scbe-math-claims.md
    - AetherMoore Master Pack: specs/aethermoore-master-pack.md
    - PQC Documentation: specs/pqc-documentation.md
    - 13 Axioms: specs/thirteen-axioms.md
  - Story & Lore:
    - The Spiral of Pollyoneth: story/spiral-of-pollyoneth.md
    - Enhanced Edition: story/enhanced-edition.md
    - Sacred Tongues Mythology: story/sacred-tongues-mythology.md
  - Patent Documentation:
    - Full Patent Draft: patents/full-patent-draft.md
    - USPTO Simulation Results: patents/uspto-sim-results.md
    - Claims Reference: patents/claims-reference.md
  - API Reference:
    - Core Functions: api/core.md
    - Tokenizer API: api/tokenizer.md
    - Security API: api/security.md
  - Contributing:
    - Development Guide: contributing/development.md
    - Code Standards: contributing/code-standards.md

plugins:
  - search
  - git-revision-date-localized

repo_name: issdandavis/scbe-aethermoore-demo
repo_url: https://github.com/issdandavis/scbe-aethermoore-demo
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Isaac Davis
